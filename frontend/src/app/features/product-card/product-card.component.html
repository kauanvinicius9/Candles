<article class="product-card">
  <div class="product-card__image">
    <img src="{{ product.imagePlaceholder }}" alt="{{ product.name }}">
  </div>
  <div class="product-card__body">

    <span class="tag">{{ categoryLabel }}</span>
    <h3 class="product-card__name">{{ product.name }}</h3>
    <p class="product-card__fragrance">{{ product.fragrance }}</p>
    <p class="product-card__description">{{ product.description }}</p>
    <p class="product-card__price">R$ {{ product.price.toFixed(2).replace('.', ',') }}</p>

    @if (product.volumML) {
      <p class="product-card__weight">{{ product.volumML }}ml</p>
    }

    @if (product.weightG) {
      <p class="product-card__weight">{{ product.weightG }}g</p>
    }

    <button class="product-card__button" type="button" (click)="openModal()">
      Compre pelo WhatsApp
    </button>
  </div>
</article>

<app-confirmation-modal 
  [isOpen]="showConfirmModal()" 
  title="Comprar via WhatsApp" 
  [message]="'Você será redirecionado para o WhatsApp para finalizar o pedido de ' + product.name + '.'" 
  (confirmed)="handleConfirm()" 
  (cancelled)="handleCancel()" />
