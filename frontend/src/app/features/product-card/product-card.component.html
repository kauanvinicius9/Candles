<article class="product-card">
  <div class="product-card__image">
    <img src="{{ product.imagePlaceholder }}" alt="{{ product.name }}">
  </div>
  <div class="product-card__body">
    <span class="tag">{{ categoryLabel }}</span>
    <h3 class="product-card__name">{{ product.name }}</h3>
    <p class="product-card__fragrance">{{ product.fragrance }}</p>
    <p class="product-card__price">R$ {{ product.price.toFixed(2).replace('.', ',') }}</p>

    <button class="product-card__button" (click)="addToCart()">
      {{ justAdded ? 'Adicionado' : 'Adicionar ao carrinho' }}
    </button>
  </div>
</article>
