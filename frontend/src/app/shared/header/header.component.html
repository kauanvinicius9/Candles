<header class="header">
  <div class="container header__inner">
    <a routerLink="/" class="header__brand" (click)="closeMenu()">
      <img src="assets/Logo-Reviva-Black-435.16x400.11.svg" alt="Reviva Logo" class="header__logo"/>
    </a>

    <nav class="header__nav" [class.active]="isMenuOpen()">
      <a routerLink="/" (click)="closeMenu()">Início</a>
      <a routerLink="/produtos" (click)="closeMenu()">Produtos</a>
      <a routerLink="/contato" (click)="closeMenu()">Contato</a>
      <a routerLink="/sobre" (click)="closeMenu()">Sobre</a>
    </nav>
    
    <div class="header__actions">
      <button type="button" class="header__toggle" [class.active]="isMenuOpen()" (click)="toggleMenu()"aria-label="Alternar menu de navegação">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</header>
