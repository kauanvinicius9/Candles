spring.application.name=candleshop

# Configuração do Banco de Dados (Lê a variável da Render ou usa o localhost se for na sua máquina)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta da Aplicação (A Render injeta a porta automaticamente na variável PORT)
server.port=${PORT:8081}

# Configuração de E-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mercado Pago (Variáveis para não expor tokens no código)
# mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# CORS (Permite passar uma URL externa da Render ou usa localhost como padrão)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}